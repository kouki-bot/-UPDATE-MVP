name: Public display safety tests

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "new.html"
      - "closed.html"
      - "scripts/tests/test_public_display_safety.py"
      - ".github/workflows/test-public-display-safety.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "new.html"
      - "closed.html"
      - "scripts/tests/test_public_display_safety.py"
      - ".github/workflows/test-public-display-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-display-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run public display safety tests
        run: python -m unittest scripts.tests.test_public_display_safety -v
