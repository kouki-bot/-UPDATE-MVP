name: Review approval safety tests

on:
  push:
    branches: [main, feat/review-checklist-gate]
    paths:
      - "admin/review.html"
      - "scripts/publish_approved.py"
      - "scripts/tests/**"
      - ".github/workflows/test-review-approval.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin/review.html"
      - "scripts/publish_approved.py"
      - "scripts/tests/**"
      - ".github/workflows/test-review-approval.yml"
      - "data/manual_candidates.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-approval-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify manual candidates remain review-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/manual_candidates.json")
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              candidates = data.get("candidates", [])
              invalid = [
                  item.get("id", "(no id)")
                  for item in candidates
                  if item.get("status") != "未確認・公開禁止"
              ]
              assert not invalid, (
                  "Manual candidates must remain unpublished until human approval: "
                  + ", ".join(invalid)
              )
              print(f"Verified {len(candidates)} manual candidates remain review-only.")
          else:
              print("No manual candidate file in this change; skipped.")
          PY
      - name: Compile publication script
        run: python -m py_compile scripts/publish_approved.py
      - name: Run publication safety tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Test approval synchronization conflict safety
        run: node scripts/tests/test_approval_sync.js
      - name: Check review UI JavaScript syntax and change outcome history
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("admin/review.html").read_text(encoding="utf-8")
          scripts = page.split("<script>", 1)
          assert len(scripts) == 2, "Review page script tag missing"
          js = scripts[1].split("</script>", 1)[0]
          Path("/tmp/review-ui.js").write_text(js, encoding="utf-8")
          required = [
              "function saveChangeReview(index)",
              '"状態更新済み","誤検出","追加調査"',
              "published_change_reviews",
              "recorded_at",
              "save-change-review",
              "function normalizeChangeReviewStore(data)",
              "data.published_change_reviews",
              "return identity+\"::\"",
              "approvals.published_change_reviews=all",
              "function changeReviewCaution(x)",
              "過去に誤検出の記録あり",
              "過去に誤検出あり・再確認",
              "今回も自動除外せず",
              "function backupEnvelope()",
              "function validateApprovals(data)",
              "ylu-review-backup-",
              "ylu-review-before-restore-",
              "バックアップを復元しました。",
              "未対応のバックアップ形式です",
              "function updateBackupReminder()",
              "ylu_review_last_backup_v1",
              "7*24*60*60*1000",
              "承認IDが重複しています",
              "承認IDに対応する審査記録がありません",
              "店舗変更履歴の形式が正しくありません",
              "function countInsightValues(getValues)",
              "function renderReviewInsights()",
              "data-flag-filter",
              "flagFilter",
              "categoryInsights",
              "municipalityInsights",

          ]
          markup_required = ["審査候補の内訳", "確認事項が多い項目（押すと絞り込み）"]
          missing_markup = [item for item in markup_required if item not in page]
          assert not missing_markup, f"Missing review dashboard markup: {missing_markup}"
          missing = [item for item in required if item not in js]
          assert not missing, f"Missing change-review features: {missing}"
          print("Change outcome recording and history fields are present.")
          PY
          node --check /tmp/review-ui.js
      - name: Check review UI checklist gate
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("admin/review.html").read_text(encoding="utf-8")
          required = [
              "store_name_verified",
              "municipality_verified",
              "published_date_verified",
              "event_date_verified",
              "business_status_verified",
              "source_url_verified",
          ]
          missing = [key for key in required if key not in page]
          assert not missing, f"Missing review checklist keys: {missing}"
          assert 'button.disabled=done!==REVIEW_CHECKS.length' in page
          print("All six review checks and disabled-until-complete UI gate are present.")
          auto_load_required = [
              "function mergeDraftRows(rows,sourceLabel)",
              "async function loadPublicCandidates()",
              'fetch("../data/manual_candidates.json",{cache:"no-store"})',
              'row.status!=="未確認・公開禁止"',
              'el("reloadPublicCandidatesBtn").addEventListener("click",loadPublicCandidates)',
              "loadPublicCandidates();",
              "Actions成果物を追加",
          ]
          missing_auto_load = [item for item in auto_load_required if item not in page]
          assert not missing_auto_load, f"Missing safe candidate auto-load features: {missing_auto_load}"
          print("Public candidate auto-load and review-only guard are present.")
          private_sync_required = [
              'PRIVATE_APPROVAL_PATH="/repos/local-life-lab/yamaguchi-review-private/contents/data/publication_approvals.json"',
              'function privateApi(path,method,payload)',
              'Authorization":"Bearer "+privateSyncToken',
              'function mergePrivateApprovals(remote,local)',
              'async function readPrivateApprovals()',
              'el("privateLoadBtn").addEventListener("click"',
              'el("privateSaveBtn").addEventListener("click"',
              'el("privateSyncToken").value="";privateSyncToken=""',
          ]
          missing_private_sync = [item for item in private_sync_required if item not in page]
          assert not missing_private_sync, f"Missing private approval sync safeguards: {missing_private_sync}"
          assert "localStorage.setItem" not in page[page.find('function getPrivateToken()'):page.find('el("privateLoadBtn")')]
          print("Private approval sync uses an in-memory token and merges remote records before saving.")
          PY
