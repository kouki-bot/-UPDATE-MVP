name: Review approval safety tests

on:
  push:
    branches: [feat/review-checklist-gate]
  pull_request:
    branches: [main]
    paths:
      - "admin/review.html"
      - "scripts/publish_approved.py"
      - "scripts/tests/**"
      - ".github/workflows/test-review-approval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-approval-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile publication script
        run: python -m py_compile scripts/publish_approved.py
      - name: Run publication safety tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Check review UI JavaScript syntax and change outcome history
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("admin/review.html").read_text(encoding="utf-8")
          scripts = page.split("<script>", 1)
          assert len(scripts) == 2, "Review page script tag missing"
          js = scripts[1].split("</script>", 1)[0]
          Path("/tmp/review-ui.js").write_text(js, encoding="utf-8")
          required = [
              "function saveChangeReview(index)",
              '"状態更新済み","誤検出","追加調査"',
              "published_change_reviews",
              "recorded_at",
              "save-change-review",
              "function normalizeChangeReviewStore(data)",
              "data.published_change_reviews",
              "return identity+\"::\"",
              "approvals.published_change_reviews=all",
              "function changeReviewCaution(x)",
              "過去に誤検出の記録あり",
              "過去に誤検出あり・再確認",
              "今回も自動除外せず",
              "function backupEnvelope()",
              "function validateApprovals(data)",
              "ylu-review-backup-",
              "ylu-review-before-restore-",
              "バックアップを復元しました。",
              "未対応のバックアップ形式です",
          ]
          missing = [item for item in required if item not in js]
          assert not missing, f"Missing change-review features: {missing}"
          print("Change outcome recording and history fields are present.")
          PY
          node --check /tmp/review-ui.js
      - name: Check review UI checklist gate
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path("admin/review.html").read_text(encoding="utf-8")
          required = [
              "store_name_verified",
              "municipality_verified",
              "published_date_verified",
              "event_date_verified",
              "business_status_verified",
              "source_url_verified",
          ]
          missing = [key for key in required if key not in page]
          assert not missing, f"Missing review checklist keys: {missing}"
          assert 'button.disabled=done!==REVIEW_CHECKS.length' in page
          print("All six review checks and disabled-until-complete UI gate are present.")
          PY
