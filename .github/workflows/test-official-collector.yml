name: Test official site collector (safe)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-official-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile scripts/collect_news.py scripts/generate_drafts.py scripts/publish_approved.py

      - name: Check review and public page JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for source in ["admin/review.html", "index.html", "new.html", "closed.html"]:
              html = Path(source).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
              for number, script in enumerate(scripts):
                  Path(f"/tmp/{Path(source).stem}-{number}.js").write_text(script, encoding="utf-8")
          PY
          for file in /tmp/review-*.js /tmp/index-*.js /tmp/new-*.js /tmp/closed-*.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Run all safety and workflow tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Run official site collector
        run: python scripts/collect_news.py

      - name: Generate draft candidates (no publishing)
        run: python scripts/generate_drafts.py

      - name: Validate generated drafts remain unpublished
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/drafts.json")
          if not path.exists():
              raise SystemExit("drafts.json was not created")
          data = json.loads(path.read_text(encoding="utf-8"))
          drafts = data.get("drafts", [])
          unsafe = [
              item for item in drafts
              if item.get("status") != "未確認・公開禁止"
          ]
          if unsafe:
              raise SystemExit(f"公開禁止状態でない下書きが {len(unsafe)} 件あります")
          invalid_urls = [
              item for item in drafts
              if item.get("source_url") and not str(item["source_url"]).startswith(("https://", "http://"))
          ]
          if invalid_urls:
              raise SystemExit(f"不正な情報源URLが {len(invalid_urls)} 件あります")
          print(f"下書き生成確認: {len(drafts)}件")
          print(f"全件未確認・公開禁止: {len(drafts)}件")
          print(f"90日より前の除外: {data.get('excluded_old_count', 0)}件")
          print(f"確認フラグ集計: {data.get('review_flag_counts', {})}")
          PY

      - name: Validate collector output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/source_checks.json")
          if not path.exists():
              raise SystemExit("source_checks.json was not created")

          data = json.loads(path.read_text(encoding="utf-8"))
          sources = data.get("sources", [])
          candidates = data.get("candidates", [])
          audit = data.get("article_audit", [])
          unsafe_candidates = [
              item for item in candidates
              if item.get("status") != "未確認・公開禁止"
          ]
          if unsafe_candidates:
              raise SystemExit("候補に公開可能以外の状態が混在しています")
          print(f"公開安全確認: {len(candidates)}件すべて未確認・公開禁止")
          print(f"公式情報源: {len(sources)}")
          print(f"調査ページ: {len(data.get('scanned_pages', []))}")
          print(f"本文確認記事: {len(audit)}")
          print(f"候補記事: {len(candidates)}")
          print(f"除外記事: {sum(1 for item in audit if item.get('result') == '除外')}")
          print(f"取得失敗記事: {sum(1 for item in audit if item.get('result') in ('取得不可', '取得失敗'))}")
          for source in sources:
              errors = source.get("fetch_errors", [])
              print(
                  f"- {source.get('name')}: "
                  f"status={source.get('status')}, "
                  f"pages={source.get('pages_scanned')}, "
                  f"errors={len(errors)}, "
                  f"note={source.get('note', '')}"
              )
              for error in errors[:5]:
                  print(f"  取得失敗: {error.get('url')} | {error.get('error')}")
          for item in candidates[:20]:
              print(
                  f"  候補: {item.get('title')} | "
                  f"{item.get('category')} | "
                  f"{item.get('area')} | "
                  f"開店日={item.get('opening_date', '')} | "
                  f"業種={item.get('industry', '')} | "
                  f"場所={item.get('floor', '')} | "
                  f"状態={item.get('status')} | {item.get('url')}"
              )
          for item in [x for x in audit if x.get('result') == '除外'][:15]:
              print(
                  f"  除外確認: {item.get('title')} | "
                  f"{item.get('reason')} | {item.get('url')}"
              )
          PY

      - name: Upload official collector results
        uses: actions/upload-artifact@v4
        with:
          name: official-site-collector-results
          path: |\n            data/source_checks.json\n            data/drafts.json
          if-no-files-found: error
          retention-days: 7
