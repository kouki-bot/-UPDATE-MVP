name: Refresh review candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-yamaguchi-review-candidates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the fixed review branch
        uses: actions/checkout@v5
        with:
          ref: fix/yamaguchi-scope-and-listing-filter
          fetch-depth: 0

      - name: Verify the checkout target
        run: |
          EXPECTED_BRANCH="fix/yamaguchi-scope-and-listing-filter"
          ACTUAL_BRANCH="$(git branch --show-current)"
          if [ "$ACTUAL_BRANCH" != "$EXPECTED_BRANCH" ]; then
            echo "Unexpected checkout: $ACTUAL_BRANCH"
            exit 1
          fi
          if [ "$GITHUB_REPOSITORY" != "kouki-bot/-UPDATE-MVP" ]; then
            echo "Unexpected repository."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          python -m py_compile scripts/collect_news.py scripts/collect_rss.py scripts/generate_drafts.py scripts/publish_approved.py

      - name: Run safety tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Collect official news candidates
        run: python scripts/collect_news.py

      - name: Collect RSS candidates
        run: python scripts/collect_rss.py

      - name: Generate review-only drafts
        run: python scripts/generate_drafts.py

      - name: Save refreshed review data to the fixed review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_checks.json data/rss_candidates.json data/drafts.json
          if git diff --cached --quiet; then
            echo "No review data changes."
          else
            git commit -m "Refresh review candidates"
            git push origin "HEAD:refs/heads/fix/yamaguchi-scope-and-listing-filter"
          fi

      - name: Upload refreshed review data
        uses: actions/upload-artifact@v4
        with:
          name: yamaguchi-review-candidates
          path: |
            data/source_checks.json
            data/rss_candidates.json
            data/drafts.json
          if-no-files-found: error
          retention-days: 14
