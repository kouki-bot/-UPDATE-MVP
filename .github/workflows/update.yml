
name: Yamaguchi Local Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect official news candidates
        run: python scripts/collect_news.py

      - name: Collect RSS news candidates
        run: python scripts/collect_rss.py

      - name: Generate article drafts
        run: python scripts/generate_drafts.py

      - name: Run publication safety tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Build approved published data
        run: python scripts/publish_approved.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_checks.json data/rss_candidates.json data/drafts.json data/published.json data/publication_approvals.json
          git diff --cached --quiet && exit 0
          git commit -m "Update news candidates and drafts"
          git fetch origin main
          git rebase origin/main
          git push origin main
