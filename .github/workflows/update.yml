name: Yamaguchi Local Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect official news candidates
        run: python scripts/collect_news.py

      - name: Collect RSS news candidates
        run: python scripts/collect_rss.py

      - name: Generate review-only drafts
        run: python scripts/generate_drafts.py

      - name: Run publication safety tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Summarize collection health and enforce review-only status
        run: python scripts/collection_report.py

      - name: Check candidate source links
        run: python scripts/check_source_links.py

      - name: Track possible changes to published stores
        run: python scripts/track_published_changes.py

      - name: Validate all collected candidates remain unpublished
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename, key in [
              ("data/source_checks.json", "candidates"),
              ("data/rss_candidates.json", "candidates"),
              ("data/drafts.json", "drafts"),
          ]:
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              rows = data.get(key, [])
              unsafe = [x for x in rows if x.get("status") != "未確認・公開禁止"]
              if unsafe:
                  raise SystemExit(f"{filename}: unpublished check failed ({len(unsafe)})")
              print(f"{filename}: {len(rows)}件すべて未確認・公開禁止")
          PY

      - name: Save review candidates as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: yamaguchi-review-candidates
          path: data/drafts.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload candidates to private review repository
        env:
          PRIVATE_REVIEW_TOKEN: ${{ secrets.PRIVATE_REVIEW_TOKEN }}
        run: python scripts/private_review_sync.py upload

  
