name: Yamaguchi Local Update

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect official news candidates
        run: python scripts/collect_news.py

      - name: Collect RSS news candidates
        run: python scripts/collect_rss.py

      - name: Generate review-only drafts
        run: python scripts/generate_drafts.py

      - name: Run publication safety tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Validate all collected candidates remain unpublished
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename, key in [
              ("data/source_checks.json", "candidates"),
              ("data/rss_candidates.json", "candidates"),
              ("data/drafts.json", "drafts"),
          ]:
              data = json.loads(Path(filename).read_text(encoding="utf-8"))
              rows = data.get(key, [])
              unsafe = [x for x in rows if x.get("status") != "未確認・公開禁止"]
              if unsafe:
                  raise SystemExit(f"{filename}: unpublished check failed ({len(unsafe)})")
              print(f"{filename}: {len(rows)}件すべて未確認・公開禁止")
          PY

      - name: Build public data from approved records only
        run: python scripts/publish_approved.py

      - name: Save public data only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published.json
          if git diff --cached --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git commit -m "Update approved published articles"
          git fetch origin main
          git rebase origin/main
          git push origin main
