name: Published Store Change Tracking Tests

on:
  pull_request:
    paths:
      - "scripts/track_published_changes.py"
      - "scripts/generate_drafts.py"
      - "scripts/tests/**"
      - ".github/workflows/test-published-store-change-tracking.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run all regression tests
        run: python -m unittest discover -s scripts/tests -v
